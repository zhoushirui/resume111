name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend and document export tests
        run: node tests/frontend.cjs
      - name: Build single-file executable
        run: python -m PyInstaller --clean --noconfirm ResumeMaterials.spec
      - name: Smoke test executable
        run: python tests/smoke_exe.py dist/ResumeMaterials.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ResumeMaterials-Windows-x64
          path: |
            dist/ResumeMaterials.exe
            README.md
          if-no-files-found: error
          retention-days: 30
